name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip
        run: unzip -o FileDrop_Upload.zip

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      - name: Create Android project
        run: |
          cd ..
          flutter create --project-name=file_drop_mobile temp_project
          cp -r temp_project/android $GITHUB_WORKSPACE/

      - run: flutter pub get
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: FileDrop-APK
          path: build/app/outputs/flutter-apk/*.apk
