name: 构建 FileDrop APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解压源码
        run: |
          python3 -c "
import zipfile, os
with zipfile.ZipFile('FileDrop_Upload.zip', 'r') as z:
    for name in z.namelist():
        fixed = name.replace('\\\\', '/')
        if fixed.endswith('/'):
            os.makedirs(fixed, exist_ok=True)
        else:
            os.makedirs(os.path.dirname(fixed), exist_ok=True)
            with open(fixed, 'wb') as f:
                f.write(z.read(name))
"
          if [ -d "file_drop_mobile" ]; then
            cp -r file_drop_mobile/* .
            rm -rf file_drop_mobile
          fi
          ls

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 创建项目骨架
        run: |
          cd ..
          flutter create --project-name=file_drop_mobile temp_project
          cp -r temp_project/android $GITHUB_WORKSPACE/

      - run: flutter pub get
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: FileDrop-APK
          path: build/app/outputs/flutter-apk/*.apk
