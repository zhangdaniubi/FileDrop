name: 构建 FileDrop APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解压源码
        run: |
          unzip -o FileDrop_Upload.zip -d .
          mv file_drop_mobile/* . 2>/dev/null || true
          rm -rf file_drop_mobile

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 创建项目骨架
        run: |
          cd ..
          flutter create --project-name=file_drop_mobile temp_project
          cp -r temp_project/android $GITHUB_WORKSPACE/

      - run: flutter pub get
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: FileDrop-APK
          path: build/app/outputs/flutter-apk/*.apk
