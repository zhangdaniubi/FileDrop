name: Build FileDrop APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract source
        run: |
          unzip -o FileDrop_Upload.zip
          mv file_drop_mobile/* . || true
          rm -rf file_drop_mobile
          ls

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Android skeleton
        run: |
          cd ..
          flutter create --project-name=file_drop_mobile temp_project
          cp -r temp_project/android $GITHUB_WORKSPACE/

      - run: flutter pub get
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: FileDrop-APK
          path: build/app/outputs/flutter-apk/*.apk
